################################
#   GENERIC SERVER PROPERTIES  #
################################

server.port=7339

app.name=SharePoint Connector
app.description=${app.name} is a Composer EDC connector for Microsoft SharePoint via Graph

spring.main.banner_mode=console
banner.charset=UTF-8
banner.location=classpath:banner.txt

######################
#  SYSLOG PROPERTIES #
######################

syslog.host=localhost
syslog.port=514
syslog.log.level=OFF
syslog.suffix=SP

###########################
#  SHAREPOINT PROPERTIES  #
###########################

sharepoint.connection.timeout.sec=30
sharepoint.read.timeout.sec=60
sharepoint.list.page.size=5000
# Raw-REST (Workbook/file) retry budget for 429/503/504. Retry-After honoured.
sharepoint.retry.max=3
# TTL (seconds) for the in-pod grid cache (Excel ranges / file contents).
# 0 disables it (default). A small value (e.g. 30-60) collapses the
# describe+fetch double-read and refresh bursts into one Graph round-trip,
# at the cost of up to TTL seconds of staleness.
sharepoint.cache.ttl.sec=0

#########################
#  ACTUATOR PROPERTIES  #
#########################

management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health

####################################
# DATA SOURCE POOL PROPERTIES      #
####################################

datasource.min.idle=0
datasource.max.idle=5
datasource.max.active=100
datasource.max.idle.time.sec=5
datasource.max.wait.time.sec=20
datasource.eviction.time.between.sec=1
